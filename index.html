<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Krater</title>
<meta name="theme-color" content="#121A28">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Krater">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-display:swap}
:root{
  --bg:#121A28; --surface:#1C2637; --surface2:#243147; --line:#2F3D55;
  --ink:#FFFFFF; --muted:#A9B4C6; --accent:#3D6BE0;
  --challenge:#2A4C8F; --duel:#4A5568; --vote:#1D5A7C; --everyone:#3A3F72; --rule:#25595E; --end:#1A2333;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #8FB0FF;outline-offset:2px}
[hidden]{display:none!important}

.wrap{max-width:540px;margin:0 auto;padding:22px 18px 56px}
.top{display:flex;justify-content:flex-end}
.lang{border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
.logo{font-weight:800;font-size:clamp(3.4rem,17vw,5rem);line-height:.9;letter-spacing:-.05em;margin:10px 0 32px}

section{margin-bottom:28px}
h2{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
.sub{font-size:1rem;font-weight:600;color:var(--muted);margin:16px 0 8px}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}

.row{display:flex;gap:8px}
input[type=text],textarea,select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
::placeholder{color:#6F7C92}

.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--ink);white-space:nowrap}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.primary{background:var(--accent)}
.btn.small{padding:8px 14px;font-size:.92rem}
.btn.danger{background:transparent;border:2px solid #B4505A;color:#FFB3B9}
.btn.big{width:100%;padding:18px;font-size:1.3rem;font-weight:800;background:var(--accent);border-radius:20px;box-shadow:0 6px 0 #22408F}
.btn.big:active{transform:translateY(4px);box-shadow:0 2px 0 #22408F}
.btn:disabled{opacity:.4;cursor:not-allowed}

.where{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.where button{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:18px 12px;font-weight:800;font-size:1.15rem;cursor:pointer;text-align:left;line-height:1.15}
.where button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px;font-weight:600}
.chip button{border:0;background:var(--line);width:26px;height:26px;border-radius:50%;cursor:pointer;line-height:1}

.seg{display:flex;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface2);color:var(--ink)}

.packs{display:grid;gap:8px}
.pack{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.pack.dim{opacity:.4}
.pack.on{border-color:var(--accent)}
.packlabel{display:flex;align-items:center;gap:12px;flex:1;cursor:pointer;min-width:0}
.pack input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.pack b{display:block;overflow-wrap:anywhere}
.pack small{color:var(--muted)}
.split{display:grid;gap:8px;padding-top:16px;margin-top:16px;border-top:1px solid var(--line)}

.list{list-style:none;padding:0;margin:12px 0 0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-top:1px solid var(--line);border-radius:10px}
.list li.editing{background:var(--surface2)}
.list li .grow{flex:1;overflow-wrap:anywhere}
.list .tapedit{cursor:pointer}
.list small{display:block;color:var(--muted)}
.list .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none;border:1px solid #ffffff55}
.stack{display:grid;gap:8px}
code{background:var(--surface);padding:1px 6px;border-radius:6px;font-size:.88em}
.empty{color:var(--muted);font-size:.95rem}

#editor{position:fixed;inset:0;overflow-y:auto;background:var(--bg);display:none;z-index:5;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#editor.on{display:block}
.ehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ehead span{color:var(--muted);font-weight:600}
.ename{font-size:1.6rem!important;font-weight:800;letter-spacing:-.02em;margin-bottom:28px}

dialog{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:22px;padding:22px;width:min(92vw,440px)}
dialog::backdrop{background:#05080FCC}
dialog h3{margin:0 0 8px;font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
dialog p{margin:0 0 16px;color:var(--muted)}
dialog textarea{min-height:110px;font-size:.85rem;margin-bottom:14px;word-break:break-all}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,20px);opacity:0;
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;pointer-events:none;transition:.25s;z-index:20;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

#game{position:fixed;inset:0;display:none;flex-direction:column;z-index:6;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);
  background:var(--c);color:#fff;transition:background .35s ease}
#game.on{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar button{border:2px solid #ffffff99;background:transparent;color:inherit;border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.bar .cog{width:42px;height:42px;padding:0;display:grid;place-items:center;border-color:#ffffff66}
.bar .cog svg{width:22px;height:22px}
.count{font-weight:600;opacity:.75}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;width:100%;margin:0 auto;cursor:pointer;user-select:none}
.kind{font-weight:800;font-size:1.1rem;opacity:.75;margin-bottom:14px}
.text{font-weight:800;font-size:clamp(1.8rem,7.5vw,3rem);line-height:1.08;letter-spacing:-.025em;margin:0}
.tap{text-align:center;opacity:.6;font-size:.95rem}
.card.flip{animation:flip .28s ease}
@keyframes flip{from{opacity:0;transform:translateY(14px) rotate(-1.5deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}#game{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="setup">
  <div class="top"><button class="lang" id="lang"></button></div>
  <h1 class="logo">Krater</h1>

  <section>
    <h2 data-t="whereH"></h2>
    <div class="where" id="where">
      <button data-v="soos">Soos</button>
      <button data-v="thuis">Niet op de soos</button>
    </div>
    <p class="hint" id="wherehint"></p>
  </section>

  <section>
    <h2 data-t="players"></h2>
    <div class="row">
      <input type="text" id="pname" data-ph="addName" maxlength="20" autocomplete="off">
      <button class="btn" id="padd" data-t="add"></button>
    </div>
    <div class="chips" id="players"></div>
    <p class="hint" id="phint" data-t="phint"></p>
  </section>

  <section>
    <h2 data-t="decks"></h2>
    <h3 class="sub" data-t="standardH"></h3>
    <div class="packs" id="stdpacks"></div>
    <h3 class="sub" data-t="ownH"></h3>
    <div class="packs" id="owndecks"></div>
    <p class="hint" id="customhint" data-t="customOnly"></p>
    <div class="row" style="margin-top:10px"><button class="btn" id="newdeck" data-t="newDeck"></button></div>
    <div class="split">
      <b data-t="importH"></b>
      <div class="row">
        <input type="text" id="importcode" data-ph="importPh" autocomplete="off">
        <button class="btn" id="importbtn" data-t="importBtn"></button>
      </div>
    </div>
  </section>

  <section>
    <h2 data-t="punishH"></h2>
    <div class="seg" id="pun">
      <button data-v="sips" data-t="sips"></button>
      <button data-v="dares" data-t="dares"></button>
      <button data-v="mix" data-t="mix"></button>
    </div>
    <p class="hint" id="punhint"></p>
  </section>

  <section>
    <h2 data-t="lengthH"></h2>
    <div class="seg" id="len">
      <button data-v="20" data-t="short"></button>
      <button data-v="40" data-t="normal"></button>
      <button data-v="70" data-t="long"></button>
    </div>
  </section>

  <section>
    <button class="btn big" id="start" data-t="start"></button>
  </section>
</main>

<div id="editor" role="dialog" aria-labelledby="ename">
  <div class="wrap">
    <div class="ehead">
      <span data-t="editDeck"></span>
      <button class="btn primary" id="edone" data-t="done"></button>
    </div>
    <input type="text" id="ename" class="ename" maxlength="40" data-ph="deckName">

    <section>
      <h2><span data-t="cardsH"></span> <span id="ccount"></span></h2>
      <div class="stack">
        <select id="ctype">
          <option value="challenge" data-t="optChallenge"></option>
          <option value="duel" data-t="optDuel"></option>
          <option value="vote" data-t="optVote"></option>
          <option value="everyone" data-t="optEveryone"></option>
          <option value="rule" data-t="optRule"></option>
        </select>
        <select id="cwhere">
          <option value="both" data-t="bothModes"></option>
          <option value="soos" data-t="soosOnly"></option>
          <option value="thuis" data-t="thuisOnly"></option>
        </select>
        <textarea id="ctext" data-ph="ctextPh"></textarea>
        <input type="text" id="cend" data-ph="cendPh" hidden>
        <div class="row">
          <button class="btn primary" id="cadd" style="flex:1"></button>
          <button class="btn ghost" id="ccancel" data-t="cancel" hidden></button>
        </div>
        <p class="hint" data-t="placeholders" data-html="1"></p>
      </div>
      <ul class="list" id="clist"></ul>
      <p class="hint" id="tapedithint" data-t="tapToEdit"></p>
    </section>

    <section>
      <h2><span data-t="daresH"></span> <span id="dcount"></span></h2>
      <div class="row">
        <input type="text" id="dtext" data-ph="dtextPh" maxlength="140">
        <button class="btn" id="dadd" data-t="add"></button>
      </div>
      <p class="hint" data-t="dhint"></p>
      <ul class="list" id="dlist"></ul>
    </section>

    <section>
      <h2 data-t="mergeH"></h2>
      <p class="hint" data-t="mergeHint" style="margin:0 0 10px"></p>
      <div class="row" id="mergerow">
        <select id="mergesel"></select>
        <button class="btn" id="mergebtn" data-t="mergeBtn"></button>
      </div>
      <p class="empty" id="mergenone" data-t="mergeNone"></p>
    </section>

    <section>
      <h2 data-t="shareH"></h2>
      <button class="btn primary" id="eshare" data-t="shareBtn"></button>
    </section>

    <section>
      <button class="btn danger" id="edelete" data-t="deleteDeck"></button>
    </section>
  </div>
</div>

<dialog id="dlg">
  <h3 id="dlgTitle"></h3>
  <p id="dlgText"></p>
  <textarea id="dlgLink" readonly hidden></textarea>
  <div class="dlgbtns">
    <button class="btn ghost" id="dlgNo"></button>
    <button class="btn primary" id="dlgYes"></button>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<div id="game" role="dialog" aria-label="Krater">
  <div class="bar">
    <button id="quit" class="cog" data-ta="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <span class="count" id="count"></span>
    <button id="back" data-t="back"></button>
  </div>
  <div class="card" id="card" tabindex="0" aria-live="polite">
    <div class="kind" id="kind"></div>
    <p class="text" id="text"></p>
  </div>
  <p class="tap" id="tap" data-t="tap"></p>
</div>

/* ---------- state ---------- */
const STORE = 'krater:v1';
function newId(){ return 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
let S = {lang:'nl', where:'soos', players:[], packs:{warmup:true, wild:false}, sel:[], pun:'mix', len:40, decks:[]};
try { const saved = JSON.parse(localStorage.getItem(STORE)); if (saved) S = Object.assign(S, saved); } catch(e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(S)); } catch(e) {} }

/* move cards from the old single "Mijn kaarten" list into a deck */
if (!Array.isArray(S.decks)) S.decks = [];
if (!Array.isArray(S.sel)) S.sel = [];
if ('custom' in S || 'dares' in S) {
  const cards = Array.isArray(S.custom) ? S.custom : [];
  const dares = Array.isArray(S.dares) ? S.dares.filter(d=>typeof d==='string') : [];
  if (cards.length || dares.length) {
    const d = {id:newId(), name:S.lang==='en' ? 'My deck' : 'Mijn deck', cards, dares};
    S.decks.push(d);
    if (S.packs && S.packs.custom) S.sel = [d.id];
  }
  delete S.custom; delete S.dares; if (S.packs) delete S.packs.custom;
  save();
}
S.sel = S.sel.filter(id => S.decks.some(d => d.id === id));

const $ = id => document.getElementById(id);
const t = k => T[S.lang][k];
const rand = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function el(tag, props={}, kids=[]){ const e=document.createElement(tag); Object.assign(e, props); kids.forEach(k=>e.append(k)); return e; }
const selDecks = () => S.decks.filter(d => S.sel.includes(d.id));
const fitsMode = c => !c.where || c.where==='both' || c.where===S.where;

/* ---------- setup screen ---------- */
function applyLang(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll('[data-t]').forEach(n=>{ if (n.dataset.html) n.innerHTML = t(n.dataset.t); else n.textContent = t(n.dataset.t); });
  document.querySelectorAll('[data-ph]').forEach(n=>{ n.placeholder = t(n.dataset.ph); });
  document.querySelectorAll('[data-ta]').forEach(n=>{ n.setAttribute('aria-label', t(n.dataset.ta)); n.title = t(n.dataset.ta); });
  $('lang').textContent = t('other');
  $('cadd').textContent = t(editCard===null ? 'addCard' : 'saveCard');
  renderWhere(); renderPlayers(); renderDecks(); renderSegs();
  if (editId) renderEditor();
}

function renderWhere(){
  $('where').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===S.where)));
  $('wherehint').textContent = t('whereHint_'+S.where);
}
$('where').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.where=b.dataset.v; save(); renderWhere(); };

function renderPlayers(){
  const box=$('players'); box.innerHTML='';
  S.players.forEach((p,i)=>{
    const x=el('button',{textContent:'×',ariaLabel:'× '+p,onclick:()=>{S.players.splice(i,1);save();renderPlayers();}});
    box.append(el('span',{className:'chip'},[p,x]));
  });
  $('phint').hidden = S.players.length >= 2;
  $('start').disabled = S.players.length < 2;
}
function addPlayer(){
  const v=$('pname').value.trim(); if(!v) return;
  if (!S.players.includes(v)) S.players.push(v);
  $('pname').value=''; $('pname').focus(); save(); renderPlayers();
}
$('padd').onclick = addPlayer;
$('pname').addEventListener('keydown', e => { if (e.key==='Enter') addPlayer(); });

function renderDecks(){
  const custom = S.sel.length > 0;
  const std=$('stdpacks'); std.innerHTML='';
  Object.entries(PACKS).forEach(([k,p])=>{
    const cb=el('input',{type:'checkbox',checked:!!S.packs[k],disabled:custom,onchange:e=>{S.packs[k]=e.target.checked;save();}});
    std.append(el('label',{className:'pack packlabel'+(custom?' dim':'')},[cb, el('div',{},[el('b',{textContent:p.name[S.lang]}), el('small',{textContent:`${p.desc[S.lang]} (${t('cardsCount')(p.cards.length)})`})])]));
  });
  const own=$('owndecks'); own.innerHTML='';
  if (!S.decks.length) own.append(el('p',{className:'hint',textContent:t('noDecks'),style:'margin:0'}));
  S.decks.forEach(d=>{
    const on = S.sel.includes(d.id);
    const cb=el('input',{type:'checkbox',checked:on,onchange:e=>{ S.sel = e.target.checked ? [...S.sel, d.id] : S.sel.filter(x=>x!==d.id); save(); renderDecks(); }});
    const lab=el('label',{className:'packlabel'},[cb, el('div',{},[el('b',{textContent:d.name}), el('small',{textContent:t('deckCounts')(d.cards.length,d.dares.length)})])]);
    const eb=el('button',{className:'btn small',textContent:t('edit'),onclick:()=>openEditor(d.id)});
    own.append(el('div',{className:'pack'+(on?' on':'')},[lab, eb]));
  });
  $('customhint').hidden = !custom;
}
$('newdeck').onclick = () => {
  const d={id:newId(), name:uniqueName(t('newDeckName')), cards:[], dares:[]};
  S.decks.push(d); save(); renderDecks(); openEditor(d.id, true);
};
function uniqueName(base){
  const names=new Set(S.decks.map(d=>d.name));
  if (!names.has(base)) return base;
  let i=2; while (names.has(`${base} (${i})`)) i++;
  return `${base} (${i})`;
}

function renderSegs(){
  $('pun').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===S.pun)));
  $('len').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(Number(b.dataset.v)===S.len)));
  $('punhint').textContent = t('punHint_'+S.pun);
}
$('pun').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.pun=b.dataset.v; save(); renderSegs(); };
$('len').onclick = e => { const b=e.target.closest('button'); if(!b) return; S.len=Number(b.dataset.v); save(); renderSegs(); };
$('lang').onclick = () => { S.lang = S.lang==='nl' ? 'en' : 'nl'; save(); applyLang(); };

/* ---------- deck editor ---------- */
let editId=null, editCard=null;
const curDeck = () => S.decks.find(d=>d.id===editId);

function openEditor(id, isNew){
  editId=id; resetCardForm();
  $('editor').classList.add('on'); $('editor').scrollTop=0; document.body.style.overflow='hidden';
  renderEditor();
  if (isNew){ $('ename').focus(); $('ename').select(); }
}
function closeEditor(){
  $('editor').classList.remove('on'); document.body.style.overflow=''; editId=null; renderDecks();
}
$('edone').onclick = closeEditor;
$('ename').oninput = () => { const d=curDeck(); if (d){ d.name = $('ename').value.trim() || t('newDeckName'); save(); } };

function renderEditor(){
  const d=curDeck(); if(!d) return;
  if (document.activeElement !== $('ename')) $('ename').value = d.name;

  const ul=$('clist'); ul.innerHTML='';
  $('ccount').textContent = `(${d.cards.length})`;
  if (!d.cards.length) ul.append(el('li',{className:'empty',textContent:t('emptyCards')}));
  d.cards.forEach((c,i)=>{
    const dot=el('span',{className:'dot'}); dot.style.background=`var(--${c.type})`;
    const info=el('span',{className:'grow tapedit',onclick:()=>editCardAt(i)},[c.text, el('small',{textContent:`${t('labels')[c.type]}, ${t('where')[c.where||'both']}`})]);
    const del=el('button',{className:'del',textContent:'✕',ariaLabel:t('delete'),onclick:()=>{
      d.cards.splice(i,1);
      if (editCard===i) resetCardForm(); else if (editCard!==null && editCard>i) editCard--;
      save(); renderEditor();
    }});
    ul.append(el('li',{className:editCard===i?'editing':''},[dot, info, del]));
  });
  $('tapedithint').hidden = !d.cards.length;

  const dl=$('dlist'); dl.innerHTML='';
  $('dcount').textContent = `(${d.dares.length})`;
  if (!d.dares.length) dl.append(el('li',{className:'empty',textContent:t('emptyDares')}));
  d.dares.forEach((x,i)=>{
    const del=el('button',{className:'del',textContent:'✕',ariaLabel:t('delete'),onclick:()=>{ d.dares.splice(i,1); save(); renderEditor(); }});
    dl.append(el('li',{},[el('span',{className:'grow',textContent:x}), del]));
  });

  const others=S.decks.filter(o=>o.id!==d.id);
  const sel=$('mergesel'); sel.innerHTML='';
  others.forEach(o=>sel.append(el('option',{value:o.id,textContent:`${o.name} (${t('deckCounts')(o.cards.length,o.dares.length)})`})));
  $('mergerow').hidden = !others.length; $('mergenone').hidden = !!others.length;
}

function resetCardForm(){
  editCard=null;
  $('ctext').value=''; $('cend').value=''; $('ctype').value='challenge'; $('cwhere').value='both';
  $('cend').hidden=true; $('cadd').textContent=t('addCard'); $('ccancel').hidden=true;
}
function editCardAt(i){
  const c=curDeck().cards[i]; editCard=i;
  $('ctype').value=c.type; $('cwhere').value=c.where||'both'; $('ctext').value=c.text; $('cend').value=c.end||'';
  $('cend').hidden = c.type!=='rule'; $('cadd').textContent=t('saveCard'); $('ccancel').hidden=false;
  renderEditor();
  $('ctype').scrollIntoView({behavior:'smooth', block:'start'});
}
$('ctype').onchange = () => { $('cend').hidden = $('ctype').value !== 'rule'; };
$('cadd').onclick = () => {
  const d=curDeck(); const text=$('ctext').value.trim(); if(!d || !text) return;
  const card={type:$('ctype').value, where:$('cwhere').value, text};
  if (card.type==='rule') card.end = $('cend').value.trim() || t('ruleOver');
  if (editCard!==null) d.cards[editCard]=card; else d.cards.push(card);
  save(); resetCardForm(); renderEditor();
};
$('ccancel').onclick = () => { resetCardForm(); renderEditor(); };

$('dadd').onclick = () => {
  const d=curDeck(); const v=$('dtext').value.trim(); if(!d || !v) return;
  if (!d.dares.includes(v)) d.dares.push(v);
  $('dtext').value=''; save(); renderEditor();
};
$('dtext').addEventListener('keydown', e => { if (e.key==='Enter') $('dadd').click(); });

function mergeInto(d, src){
  const hc=new Set(d.cards.map(c=>c.type+'|'+c.text)), hd=new Set(d.dares);
  let nc=0, nd=0;
  src.cards.forEach(c=>{ const k=c.type+'|'+c.text; if(!hc.has(k)){ d.cards.push({...c}); hc.add(k); nc++; } });
  src.dares.forEach(x=>{ if(!hd.has(x)){ d.dares.push(x); hd.add(x); nd++; } });
  return [nc, nd];
}
$('mergebtn').onclick = () => {
  const d=curDeck(), src=S.decks.find(o=>o.id===$('mergesel').value);
  if (!d || !src) return;
  const [nc,nd]=mergeInto(d, src); save(); renderEditor(); toast(t('merged')(nc,nd));
};
$('eshare').onclick = () => shareDeck(curDeck());
$('edelete').onclick = () => {
  const d=curDeck(); if(!d) return;
  openDialog({title:t('deleteQ')(d.name), text:t('deleteText'), yes:t('delete'), no:t('cancel'), onYes:()=>{
    S.decks=S.decks.filter(x=>x.id!==d.id); S.sel=S.sel.filter(x=>x!==d.id); save(); closeEditor();
  }});
};

/* ---------- dialogs & toasts ---------- */
let toastTimer;
function toast(msg){ const n=$('toast'); n.textContent=msg; n.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>n.classList.remove('on'),2600); }
function openDialog({title, text, link, yes, no, onYes}){
  const d=$('dlg');
  $('dlgTitle').textContent=title; $('dlgText').textContent=text;
  $('dlgLink').hidden=!link; $('dlgLink').value=link||'';
  $('dlgYes').textContent=yes; $('dlgNo').textContent=no;
  $('dlgYes').onclick=()=>{ if (onYes && onYes()===false) return; d.close(); };
  $('dlgNo').onclick=()=>d.close();
  d.showModal();
}

/* ---------- sharing ---------- */
const b64u = bytes => { let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => { let b=str.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='='; return Uint8Array.from(atob(b), c=>c.charCodeAt(0)); };
async function packDeck(obj){
  let data=new TextEncoder().encode(JSON.stringify(obj)), z='0';
  if ('CompressionStream' in window){
    try { data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()); z='1'; } catch(e){}
  }
  return z + b64u(data);
}
async function unpackDeck(code){
  let data=unb64u(code.slice(1));
  if (code[0]==='1') data=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return JSON.parse(new TextDecoder().decode(data));
}
const TYPES=['challenge','duel','vote','everyone','rule'], WHERES=['both','soos','thuis'];
const str = (v,max) => typeof v==='string' && v.trim() ? v.trim().slice(0,max) : null;
function cleanDeck(o){
  if (!o || o.v!==1 || !Array.isArray(o.c) || !Array.isArray(o.d)) throw new Error('bad');
  const cards = o.c.slice(0,500).map(c=>{
    if (!Array.isArray(c) || !TYPES.includes(c[0])) return null;
    const text=str(c[2],500); if(!text) return null;
    const card={type:c[0], where:WHERES.includes(c[1])?c[1]:'both', text};
    if (card.type==='rule') card.end = str(c[3],300) || t('ruleOver');
    return card;
  }).filter(Boolean);
  const dares = [...new Set(o.d.slice(0,500).map(x=>str(x,140)).filter(Boolean))];
  return {name: str(o.n,40) || t('defaultDeckName'), cards, dares};
}

async function shareDeck(d){
  if (!d) return;
  if (!d.cards.length && !d.dares.length){ toast(t('nothingToShare')); return; }
  const code=await packDeck({v:1, n:d.name, c:d.cards.map(c=>[c.type, c.where||'both', c.text, c.end||'']), d:d.dares});
  const url=location.origin+location.pathname+'#deck='+code;
  const text=t('shareText')(d.name);
  if (navigator.share){
    try { await navigator.share({title:'Krater', text, url}); return; }
    catch(e){ if (e.name==='AbortError') return; }
  }
  openDialog({title:t('copyTitle'), text:t('copyText'), link:url, yes:t('copy'), no:t('close'), onYes:()=>{
    $('dlgLink').select();
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(()=>toast(t('copied')),()=>{ try{ document.execCommand('copy'); toast(t('copied')); }catch(e){} });
  }});
}

async function importCode(raw){
  const m=String(raw).match(/deck=([A-Za-z0-9_-]+)/);
  const code=m ? m[1] : String(raw).trim();
  let deck;
  try { deck=cleanDeck(await unpackDeck(code)); } catch(e){ toast(t('badDeck')); return; }
  if (!deck.cards.length && !deck.dares.length){ toast(t('badDeck')); return; }
  openDialog({title:t('importTitle')(deck.name), text:t('importSummary')(deck.cards.length, deck.dares.length), yes:t('addDeck'), no:t('cancel'), onYes:()=>{
    const name=uniqueName(deck.name);
    S.decks.push({id:newId(), name, cards:deck.cards, dares:deck.dares});
    save(); renderDecks(); $('importcode').value=''; toast(t('added')(name));
  }});
}
$('importbtn').onclick = () => { const v=$('importcode').value.trim(); if (v) importCode(v); };
function handleHash(){
  if (!location.hash.startsWith('#deck=')) return;
  const code=location.hash.slice(6);
  history.replaceState(null,'',location.pathname+location.search);
  importCode(code);
}
window.addEventListener('load', handleHash);
window.addEventListener('hashchange', handleHash);

/* ---------- game ---------- */
function punishment(){
  const sips = () => t('sip')(rand(1,4));
  const dares = S.sel.length ? selDecks().flatMap(d=>d.dares) : DEFAULT_DARES.map(x=>x[S.lang]);
  if (S.pun==='sips' || !dares.length) return sips();
  if (S.pun==='dares') return pick(dares);
  return Math.random()<.5 ? sips() : pick(dares);
}
function normalize(card){
  if (card.text) return {type:card.type, text:card.text, end:card.end||null};
  const [text,end] = card[S.lang];
  return {type:card.type, text, end:end||null};
}
function resolve(card){
  const ps=shuffle(S.players);
  const map={1:ps[0], 2:ps[1]||ps[0], 3:ps[2]||ps[1]||ps[0]};
  const fill = s => s.replace(/\{punish\}/g, ()=>punishment())
                     .replace(/\{n\}/g, ()=>rand(1,4))
                     .replace(/\{p([123])\}/g, (m,d)=>map[d]);
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  return {type:card.type, text:cap(fill(card.text)), end: card.end ? cap(fill(card.end)) : null};
}
function buildDeck(){
  let pool=[];
  if (S.sel.length){
    pool = selDecks().flatMap(d=>d.cards).filter(fitsMode);
    if (!pool.length) return null;
  } else {
    Object.keys(PACKS).forEach(k=>{ if (S.packs[k]) pool.push(...PACKS[k].cards); });
    if (!pool.length) return null;
    pool.push(...MODE_CARDS[S.where]);
  }
  pool = pool.map(normalize);
  let raw=[]; while (raw.length < S.len) raw.push(...shuffle(pool));
  raw = raw.slice(0, S.len);
  const out=[], pending=[];
  raw.forEach(c=>{
    const r=resolve(c); out.push(r);
    pending.forEach(p=>p.left--);
    for (let i=pending.length-1;i>=0;i--) if (pending[i].left<=0){ out.push(pending[i].card); pending.splice(i,1); }
    if (r.end) pending.push({left:rand(4,8), card:{type:'end', text:r.end}});
  });
  pending.forEach(p=>out.push(p.card));
  return out;
}

let deck=[], idx=0;
function show(){
  const done = idx>=deck.length;
  const type = done ? 'end' : deck[idx].type;
  $('game').style.setProperty('--c', `var(--${type})`);
  $('kind').textContent = done ? t('over') : t('labels')[type];
  $('text').textContent = done ? t('overText') : deck[idx].text;
  $('count').textContent = done ? '' : `${idx+1} / ${deck.length}`;
  $('tap').hidden = done;
  $('back').style.visibility = idx>0 ? 'visible' : 'hidden';
  const c=$('card'); c.classList.remove('flip'); void c.offsetWidth; c.classList.add('flip');
}
function start(){
  deck = buildDeck();
  if (!deck){ toast(S.sel.length ? t('noCustom') : t('noDeck')); return; }
  idx=0; $('game').classList.add('on'); document.body.style.overflow='hidden'; show(); $('card').focus();
}
function quit(){ $('game').classList.remove('on'); document.body.style.overflow=''; }
function next(){ if (idx<deck.length){ idx++; show(); } }
$('start').onclick = start;
$('card').onclick = next;
$('back').onclick = () => { if (idx>0){ idx--; show(); } };
$('quit').onclick = () => {
  if (idx>=deck.length) return quit();
  openDialog({title:t('settings'), text:t('confirmQuit'), yes:t('stop'), no:t('keepPlaying'), onYes:quit});
};
document.addEventListener('keydown', e => {
  if (!$('game').classList.contains('on') || $('dlg').open) return;
  if (e.key===' ' || e.key==='ArrowRight' || e.key==='Enter'){ e.preventDefault(); next(); }
  if (e.key==='ArrowLeft') $('back').click();
  if (e.key==='Escape') $('quit').click();
});

applyLang();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
